
<div class="audio-timeline-wrapper ios-group" id="audioTimelineWrapper">
    <div class="audio-timeline-header">
        <span>⏱️ Timeline Duration Preview<span class="help-tip">❔<span class="tooltip-text">Live video timeline duration preview. Visualizes active and end-action durations for both Background Video and Center Overlay Video.</span></span></span>
    </div>
    <div class="audio-track-line" id="trackLineL">
        <div class="track-info">
            <span class="channel-badge blue-badge" id="badgeL">BG</span>
            <span style="font-size: 13px; font-weight: 600; color: #007aff;">Background Video</span>
        </div>
        <div class="track-info" style="margin-top: 4px;">
            <span class="channel-badge" id="badgeLa">L</span>
            <select class="track-source-select blue-source" id="trackLSourceSelect" onchange="updateTrackRouting('L', this.value)">
                <option value="background" selected>Background Audio (Blue)</option>
                <option value="center">Center Audio (Red)</option>
                <option value="custom">Custom Audio/Video...</option>
            </select>
            <label class="track-enc-checkbox" style="font-size: 11px;">
                <input type="checkbox" id="trackLEncCheckbox" checked onchange="updateTrackEncState('L', this.checked)"> 🔒 Encrypt
            </label>
        </div>
        <div id="trackLCustomRow" style="display: none; gap: 8px; align-items: center; padding: 4px 12px 8px 12px; font-size: 12px;">
            <span style="color: #007aff; font-weight: 600;">Custom L:</span>
            <input type="file" id="trackLCustomFile" accept="audio/*,video
