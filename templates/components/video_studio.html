<div id="videoStudio">
    <div class="ios-group">
        <div class="ios-group-header">1. Select Mode & Upload Video</div>
        <div class="ios-group-row" style="padding: 10px 15px;">
            <label class="ios-label">Encryption Mode<span class="help-tip">❔<span class="tooltip-text">Normal: Slices and scrambles the entire screen. Center: Overlays a secondary untouched image/video in the center (1/4 size) while scrambling the background.</span></span></label>
            <div class="segmented-control">
                <button type="button" id="modeNormal" class="segment-btn active" onclick="setEncryptionMode('normal')">Normal</button>
                <button type="button" id="modeCenter" class="segment-btn" onclick="setEncryptionMode('center')">Center Video</button>
            </div>
        </div>
        <div class="ios-group-row">
            <label class="ios-label" id="uploadLabel">Upload Video Files (Batch Supported)<span class="help-tip">❔<span class="tooltip-text">You can select multiple files to encrypt them in sequence. The encryption keys will be printed sequentially.</span></span></label>
            <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 6px;">
                <input type="file" id="mediaUpload" multiple class="ios-file-input" accept="video/*,image/*" style="flex: 1;">
                <button type="button" class="ios-btn-small" style="white-space: nowrap;" onclick="openInputVaultPicker('video', false)">📂 Pick from Vault</button>
            </div>
            <div class="file-list" id="fileList"></div>
            <div id="videoInspector" class="media-inspector hidden"></div>
            <div class="ios-group-info" id="uploadVideoBitrateInfo" style="display: none; margin-top: 6px;"></div>
            <div class="url-download-container" style="margin-top: 10px;">
                <label class="ios-label" style="font-size: 12px; color: #555;">Or Download via URL / CLI (yt-dlp)<span class="help-tip">❔<span class="tooltip-text">Enter URL or custom arguments (without 'yt-dlp'). Press Enter to download directly to input vault.</span></span></label>
                <div style="display: flex; gap: 6px; align-items: center;">
                    <input type="text" id="videoUrlInput" class="ios-input url-cmd-input" placeholder="e.g. https://youtu.be/... or -f bestvideo+bestaudio URL" onkeydown="if(event.key==='Enter') triggerUrlDownload('video', false)">
                    <button type="button" class="ios-btn-small" onclick="triggerUrlDownload('video', false)">⬇️ Download</button>
                </div>
                <div id="videoTerminal" class="mini-terminal hidden">
                    <div class="mini-terminal-header">
                        <span>📺 yt-dlp terminal</span>
                        <button type="button" class="mini-terminal-close" onclick="closeTerminal('videoTerminal')">✕</button>
                    </div>
                    <pre id="videoTerminalLog" class="mini-terminal-log"></pre>
                </div>
            </div>
        </div>
        <div class="ios-group-row hidden" id="centerVideoSection">
            <label class="ios-label" style="color: #007aff;">Upload Central Video (untouched)</label>
            <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 6px;">
                <input type="file" id="centerVideoUpload" class="ios-file-input" accept="video
