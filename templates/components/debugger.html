<div id="debugModal" class="modal-overlay hidden" style="z-index: 9999;">
    <div class="modal-content" style="background: #fdfdfd; border-radius: 12px; border: 2px solid #ff3b30; box-shadow: 0 10px 40px rgba(0,0,0,0.5); width: 90%; max-width: 750px; display: flex; flex-direction: column; overflow: hidden; max-height: 85vh; text-align: left; margin: auto;">
        <!-- Header -->
        <div style="background: linear-gradient(to bottom, #ff5e57 0%, #ff3b30 100%); color: white; padding: 12px 16px; font-weight: bold; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #d62d20; text-shadow: 0 -1px 0 rgba(0,0,0,0.4);">
            <span style="font-size: 15px; display: flex; align-items: center; gap: 6px;">🐍 Python Traceback Debugger</span>
            <button onclick="closeDebugger()" style="background: rgba(0,0,0,0.25); border: 1px solid rgba(0,0,0,0.15); border-radius: 4px; color: white; padding: 2px 8px; font-weight: bold; cursor: pointer; font-size: 12px;">Close</button>
        </div>
        <!-- Content -->
        <div style="padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; font-size: 13px; color: #333;">
            <div style="background: #ffe5e5; border-left: 4px solid #ff3b30; padding: 10px 14px; border-radius: 4px; color: #c0392b; font-weight: bold;" id="debugErrorMessage">
                Error message
            </div>
            
            <div style="font-weight: bold; margin-bottom: -4px;">Diagnostic Recommendations:</div>
            <div id="debugDiagnosticHelp" style="background: #f4f6f8; border: 1px solid #dcdcdc; border-radius: 6px; padding: 10px 14px; font-style: italic; color: #555; line-height: 1.45;">
                Recommendations go here...
            </div>
            
            <div style="font-weight: bold; margin-bottom: -4px;">Python Stack Trace:</div>
            <pre id="debugTraceback" style="background: #1e1e24; color: #87e070; padding: 14px; border-radius: 6px; font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; line-height: 1.5; overflow-x: auto; white-space: pre-wrap; margin: 0; box-shadow: inset 0 2px 6px rgba(0,0,0,0.3); max-height: 350px;"></pre>
        </div>
        <!-- Footer -->
        <div style="background: #eaeaea; border-top: 1px solid #c8c7cc; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px;">
            <button id="copyDebugLogBtn" onclick="copyTracebackToClipboard()" class="ios-btn-small" style="padding: 6px 12px; font-weight: bold; cursor: pointer; background: linear-gradient(to bottom, #ffffff 0%, #c8c8c8 100%); border-color: #a0a0a0; text-shadow: 0 1px 0 rgba(255,255,255,0.8); color: #333; border-radius: 4px;">📋 Copy Traceback</button>
            <button onclick="closeDebugger()" class="ios-btn-small" style="padding: 6px 12px; font-weight: bold; cursor: pointer; background: linear-gradient(to bottom, #ffffff 0%, #c8c8c8 100%); border-color: #a0a0a0; text-shadow: 0 1px 0 rgba(255,255,255,0.8); color: #333; border-radius: 4px;">Acknowledge</button>
        </div>
    </div>
</div>
